name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-24.04
    container: swift:${{ matrix.swift }}-noble
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Test LaneKeepKit
        run: swift test --package-path Packages/LaneKeepKit

  macos:
    name: macOS (Xcode ${{ matrix.xcode }})
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Xcode and the newest one on the runner.
        xcode: ["16.0", "26.3"]
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test LaneKeepKit
        run: swift test --package-path Packages/LaneKeepKit
      - name: Build the lanekeep command
        run: swift build --package-path Packages/LaneKeepKit --configuration release --product lanekeep
      - name: Build the app
        run: |
          xcodebuild \
            -project LaneKeep.xcodeproj \
            -scheme LaneKeep \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Show the resolved packages
        run: cat LaneKeep.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || true
      - name: Render UI snapshots
        # A debug build renders every screen with sample data (see SnapshotRenderer.swift).
        if: matrix.xcode == '26.3'
        timeout-minutes: 8
        shell: bash
        run: |
          xcodebuild \
            -project LaneKeep.xcodeproj \
            -scheme LaneKeep \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build-debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -3
          build-debug/Build/Products/Debug/LaneKeep.app/Contents/MacOS/LaneKeep \
            --render-ui-snapshots "$RUNNER_TEMP/snapshots" | grep '^LKSNAP' || true
