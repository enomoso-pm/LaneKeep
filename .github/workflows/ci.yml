name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-24.04
    container: swift:${{ matrix.swift }}-noble
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Test LaneKeepKit
        run: swift test --package-path Packages/LaneKeepKit

  macos:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          swift --version
      - name: Test LaneKeepKit
        run: swift test --package-path Packages/LaneKeepKit
      - name: Build the lanekeep command
        run: swift build --package-path Packages/LaneKeepKit --configuration release --product lanekeep
      - name: Build the app
        if: hashFiles('LaneKeep.xcodeproj/project.pbxproj') != ''
        run: |
          xcodebuild \
            -project LaneKeep.xcodeproj \
            -scheme LaneKeep \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
